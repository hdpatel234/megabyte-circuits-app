kind = "mobile"
previewPath = "/"
title = "Megabyte PCB Operations"
description = "A mobile-first employee operations app for Megabyte’s Circuit Systems, helping factory teams monitor PCB jobs, update manufacturing stages, manage inventory, and stay on top of daily production work."
version = "1.0.0"
id = "artifacts/megabyte-pcb-operations"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24166

[services.development]
run = "pnpm --filter @workspace/megabyte-pcb-operations run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/megabyte-pcb-operations", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/megabyte-pcb-operations", "run", "serve" ]

[services.env]
PORT = "24166"
BASE_PATH = "/"
